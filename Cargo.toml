[package]
name = "agents-skills"
version = "0.27.0"
edition = "2024"
description = "A minimal, stable, easy-to-understand skill installer and manager for AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skill-one/agents-skills"
homepage = "https://github.com/skill-one/agents-skills"
readme = "README.md"
keywords = ["skills", "ai-agents", "cli", "installer", "claude"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
exclude = [".github/", ".codebuddy/", "docs/", "tests/", "examples/", "scripts/", "AGENTS.md"]

[[bin]]
name = "agents-skills"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = { version = "0.0.45", features = [] }
ureq = { version = "3", features = ["gzip"] }
dirs = "7"
tempfile = "3"
thiserror = "2"
tar = "0.4"
flate2 = "1"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system"] }

[target.'cfg(unix)'.dependencies]
# Relative symlink targets for agent dir links.
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
# Directory junctions: agent dir links that need no Developer Mode or admin rights.
junction = "2"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
# Windows application manifest (long-path aware, UTF-8 code page).
embed-manifest = "1.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
